[package]
name = "cce-vault-web"
version = "0.1.0"
edition = "2021"
description = "The vault in a browser: a cce-ui PWA over an in-memory cce-vault, synced with Dropbox"

# A cdylib for wasm-bindgen (the page), and an rlib so the portable half
# (sync engine, Dropbox wire types) is tested natively.
[lib]
name = "cce_vault_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
cce-vault = { git = "https://github.com/lsgalante/cce-vault.git", rev = "ee2f46e35206779ad4fd5e4a1bdade01bde61977" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
log = "0.4"
chrono = "0.4"
# An Instant that works in the browser (std's panics on wasm32).
web-time = "1"
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "8778d0a3f6840b8b3dc1050d89be4cedf6ac95e4", features = ["markdown", "doc_editor"] }

# The page: wasm-bindgen's glue, IndexedDB, fetch and the login redirect.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Document",
    "Location",
    "History",
    "Crypto",
    "Event",
    "EventTarget",
    "DomException",
    "DomStringList",
    "HtmlCanvasElement",
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "Headers",
    "Request",
    "RequestInit",
    "Response",
    "UrlSearchParams",
] }

[dev-dependencies]
env_logger = "0.11"
