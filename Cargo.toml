[package]
name = "cce-vault-web"
version = "0.1.0"
edition = "2021"
description = "The vault in a browser: a cce-ui PWA over an in-memory cce-vault, synced with cce-sync"

# A cdylib for wasm-bindgen (the page), and an rlib so the portable half
# (the phone's sync rules, the login) is tested natively.
[lib]
name = "cce_vault_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
cce-vault = { git = "https://github.com/lsgalante/cce-vault.git", rev = "e505879a46a3a065f562054ed9f5c8267089af38" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The sync rules and wire types the laptop and the server share; no I/O.
cce-sync = { git = "https://github.com/lsgalante/cce-sync.git", rev = "8688b361ab41210be4f8f04cc46c2a285728e599", default-features = false }
sha2 = "0.10"
base64 = "0.22"
log = "0.4"
chrono = "0.4"
# An Instant that works in the browser (std's panics on wasm32).
web-time = "1"
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "160b9e8f3e5cbee583b27d03b380543311fe168c", features = ["markdown", "doc_editor"] }

# The page: wasm-bindgen's glue, IndexedDB, fetch, the live socket and the
# login redirect.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Document",
    "Location",
    "History",
    "Crypto",
    "Event",
    "EventTarget",
    "DomException",
    "DomStringList",
    "HtmlCanvasElement",
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "Headers",
    "Request",
    "RequestInit",
    "Response",
    "UrlSearchParams",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
] }

[dev-dependencies]
env_logger = "0.11"
