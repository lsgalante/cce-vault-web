[package]
name = "cce-vault-web"
version = "0.1.0"
edition = "2021"
description = "The vault in a browser: a cce-ui PWA over an in-memory cce-vault, synced with Dropbox"

# A cdylib for wasm-bindgen (the page), and an rlib so the portable half
# (sync engine, Dropbox wire types) is tested natively.
[lib]
name = "cce_vault_web"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
cce-vault = { git = "https://github.com/lsgalante/cce-vault.git", rev = "9697535b1721d00efb6e0cfc88c2349072d5f5bd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
log = "0.4"
chrono = "0.4"
# An Instant that works in the browser (std's panics on wasm32).
web-time = "1"
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "69a06f891dc9c56be4897ce92173002ad586fabb", features = ["markdown", "doc_editor"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window"] }

[dev-dependencies]
env_logger = "0.11"
